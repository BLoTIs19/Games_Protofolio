<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin login</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
<div class="login-screen">
  <div class="login-card">
    <p class="eyebrow">// portfolio admin</p>
    <h1>Sign in</h1>
    <div class="form-error" id="loginError" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign in</button>
    </form>
    <p class="login-note">
      Demo credentials: <code>admin</code> / <code>changeme123</code>. This login runs entirely in your
      browser and is for personal use only — see the project README before relying on it for real access control.
    </p>
    <a class="login-back" href="../index.html">&larr; Back to portfolio</a>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
  if (Auth.isAuthenticated()) {
    window.location.href = "dashboard.html";
  }

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const result = await Auth.attemptLogin(username, password);
    if (result.ok) {
      window.location.href = "dashboard.html";
    } else {
      errorBox.textContent = result.error;
      errorBox.classList.add("show");
    }
  });
</script>
</body>
</html>
